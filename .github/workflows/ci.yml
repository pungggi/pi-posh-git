name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No package-lock.json — install is a no-op (no runtime deps).
      - run: npm install --package-lock-only --ignore-scripts || true
      - name: Verify packed tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          ! grep -E '\b(test/|coverage/|\.github/)' pack.log
          grep -E 'src/index\.ts' pack.log
